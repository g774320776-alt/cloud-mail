name: ↩️ Rollback jd Worker

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          set -e
          API=https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts/jd
          curl -fsS -H "Authorization: Bearer $T" "$API/versions" > v.json
          jq -r '.result.items[] | "\(.id) \(.metadata.created_on) \(.metadata.source)"' v.json | head -6
          VID=$(jq -r '[.result.items[] | select(.metadata.created_on < "2026-10-14T14:10:00")] | sort_by(.metadata.created_on) | last | .id' v.json)
          echo "rollback to $VID"
          [ -n "$VID" ] && [ "$VID" != null ]
          curl -fsS -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$API/deployments" \
            -d "{\"strategy\":\"percentage\",\"versions\":[{\"version_id\":\"$VID\",\"percentage\":100}]}" | jq '{success, errors}'
          sleep 15
          curl -s -o /dev/null -w "site HTTP %{http_code}\n" https://1.774320776.dpdns.org/
