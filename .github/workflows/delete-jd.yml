name: 🗑️ Delete jd Worker

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          set -e
          B=https://api.cloudflare.com/client/v4/accounts/$A
          curl -fsS -X DELETE -H "Authorization: Bearer $T" "$B/workers/scripts/jd?force=true" | jq -c '{success, errors}'
          curl -sS -X DELETE -H "Authorization: Bearer $T" "$B/storage/kv/namespaces/c64255408d1b474a87ce9ecaef2515ef" | jq -c '{success, errors}'
          curl -sS -H "Authorization: Bearer $T" "$B/workers/scripts/jd" -o /dev/null -w "jd now HTTP %{http_code}\n"
