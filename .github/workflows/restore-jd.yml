name: ♻️ Restore jd code

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          API=https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts/jd
          VID=$(curl -sS -H "Authorization: Bearer $T" "$API/versions" | jq -r '.result.items[] | select(.id|startswith("0c9a93ea")) | .id')
          echo "vid=$VID" > out.txt
          for u in "$API/versions/$VID/content"; do
            code=$(curl -sS -o r.bin -w "%{http_code}" -H "Authorization: Bearer $T" "$u")
            t=$(grep -ao '终端 v[0-9.]*' r.bin | sort -u | tr '\n' ' ')
            echo "$code $t $(wc -c < r.bin) ${u#$API}" >> out.txt
            if [ "$code" = 200 ] && echo "$t" | grep -q "v3.0" && [ ! -f good.bin ]; then cp r.bin good.bin; cp r.bin /dev/null; fi
          done
          curl -sS -H "Authorization: Bearer $T" "$API/versions/$VID/content" | head -c 1100 | tr -cd '[:print:]\n' >> out.txt
          echo >> out.txt
          curl -sS -H "Authorization: Bearer $T" "$API/versions/$VID" | jq -c '.result.resources.script, .result.resources.script_runtime' | head -c 800 >> out.txt
          cat out.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q d && cp out.txt d/ && cd d
          git config user.email a@b.c && git config user.name bot
          git add out.txt && git commit -qm diag
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/diag
