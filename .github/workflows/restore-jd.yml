name: ♻️ Restore jd code

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          set -e
          API=https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts/jd
          curl -fsSL "https://raw.githubusercontent.com/g774320776-alt/guang/main/%E6%98%8E%E6%96%87%E6%BA%90%E5%90%97" -o worker.js
          grep -q "终端 v3.0" worker.js
          curl -fsS -X PUT -H "Authorization: Bearer $T" "$API/content" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F "worker.js=@worker.js;type=application/javascript+module" | jq -c '{success, errors}'
          curl -fsS -X PATCH -H "Authorization: Bearer $T" "$API/settings" \
            -F 'settings={"compatibility_date":"2026-10-02"};type=application/json' | jq -c '{success, c: .result.compatibility_date}'
          sleep 15
          curl -s -o /dev/null -w "site %{http_code}\n" https://1.774320776.dpdns.org/
