name: 🔎 Inspect jd Worker

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          API=https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts/jd
          R=$(curl -sS -H "Authorization: Bearer $T" "$API/settings")
          B=$(echo "$R" | jq -c '{c:.result.compatibility_date,f:.result.compatibility_flags,b:[.result.bindings[]|{name,type}]}')
          V=$(curl -sS -H "Authorization: Bearer $T" "$API/versions" | jq -c '[.result.items[:6][]|{id:.id[0:8],t:.metadata.created_on,s:.metadata.source}]')
          D=$(curl -sS -H "Authorization: Bearer $T" "$API/deployments" | jq -c '[.result.deployments[:3][]|{t:.created_on,v:[.versions[]|.version_id[0:8]]}]')
          H=$(curl -s -o /dev/null -w "%{http_code}" https://1.774320776.dpdns.org/)
          MSG="settings=$B versions=$V deployments=$D http=$H"
          echo "$MSG"
          echo "$MSG" > out.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create -R ${{ github.repository }} -t "jd inspect" -F out.txt
