name: 🛰️ Deploy guang (cfnew) Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: guang
      GUANG_DOMAIN: guang.774320776.dpdns.org
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch source
        run: |
          mkdir -p g && cd g
          curl -fsSL "https://raw.githubusercontent.com/g774320776-alt/guang/main/%E6%98%8E%E6%96%87%E6%BA%90%E5%90%97" -o _worker.js
          wc -c _worker.js
          npm i wrangler@4 --silent
          npx wrangler telemetry disable || true

      - name: KV namespace
        working-directory: g
        run: |
          LIST=$(npx wrangler kv namespace list)
          ID=$(echo "$LIST" | jq -r ".[] | select(.title == \"$WORKER_NAME\") | .id")
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create "$WORKER_NAME" >/dev/null
            ID=$(npx wrangler kv namespace list | jq -r ".[] | select(.title == \"$WORKER_NAME\") | .id")
          fi
          [ -n "$ID" ] || { echo "KV create failed"; exit 1; }
          echo "KV_ID=$ID" >> $GITHUB_ENV

      - name: Deploy
        working-directory: g
        run: |
          cat > wrangler.toml <<TOML
          name = "$WORKER_NAME"
          main = "_worker.js"
          compatibility_date = "2026-01-20"
          workers_dev = false
          preview_urls = false
          keep_vars = true

          [[kv_namespaces]]
          binding = "C"
          id = "$KV_ID"

          [[routes]]
          pattern = "$GUANG_DOMAIN"
          custom_domain = true
          TOML
          npx wrangler deploy 2>&1 | grep -v "workers.dev"
          exit ${PIPESTATUS[0]}

      - name: Check
        run: |
          sleep 15
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://$GUANG_DOMAIN/" || true
