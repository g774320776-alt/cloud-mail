name: ⬆️ Update jd Worker code

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Update code only (keep bindings/vars)
        run: |
          set -e
          API=https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts/jd
          curl -fsS -H "Authorization: Bearer $T" "$API/settings" > s.json
          echo "before compat: $(jq -r .result.compatibility_date s.json)  bindings: $(jq -c '[.result.bindings[]|{name,type}]' s.json)"
          curl -fsSL "https://raw.githubusercontent.com/byJoey/cfnew/main/%E6%98%8E%E6%96%87%E6%BA%90%E5%90%97" -o worker.js
          wc -c worker.js
          grep -q "export default" worker.js
          curl -fsS -X PUT -H "Authorization: Bearer $T" "$API/content" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F "worker.js=@worker.js;type=application/javascript+module" | jq '{success, errors}'
          curl -fsS -X PATCH -H "Authorization: Bearer $T" "$API/settings" \
            -F 'settings={"compatibility_date":"2026-01-20"};type=application/json' | jq '{success, errors, compat: .result.compatibility_date}'
          sleep 10
          curl -s -o /dev/null -w "site HTTP %{http_code}\n" https://1.774320776.dpdns.org/
