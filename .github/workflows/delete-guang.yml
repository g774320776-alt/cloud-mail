name: 🗑️ Delete guang Worker

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Delete worker and KV
        run: |
          mkdir g && cd g && npm i wrangler@4 --silent
          npx wrangler delete --name guang --force
          ID=$(npx wrangler kv namespace list | jq -r '.[] | select(.title == "guang") | .id')
          if [ -n "$ID" ]; then npx wrangler kv namespace delete --namespace-id "$ID" --skip-confirmation || npx wrangler kv namespace delete --namespace-id "$ID"; fi
          echo done
